<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Empires - Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Menu Screen -->
        <div id="menu" class="screen active">
            <div class="menu-container">
                <h1>Mini Empires</h1>
                <p class="subtitle">Conquer the map. Build your empire.</p>
                <button id="playBtn" class="btn btn-primary">PLAY NOW</button>
                <button id="settingsBtn" class="btn btn-secondary">Settings</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game" class="screen">
            <div class="game-header">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Gold:</span>
                        <span id="goldCount" class="value">600</span>
                    </div>
                    <div class="stat">
                        <span class="label">Oil:</span>
                        <span id="oilCount" class="value">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Population:</span>
                        <span id="popCount" class="value">10</span>
                    </div>
                </div>
                <button id="menuBtn" class="btn btn-small">Menu</button>
            </div>

            <div class="game-container">
                <!-- Map Canvas -->
                <div id="mapContainer" class="map-container">
                    <canvas id="gameCanvas"></canvas>
                </div>

                <!-- Bottom UI Panel -->
                <div class="bottom-panel">
                    <div class="tile-info" id="tileInfo">
                        <p>Click on a tile to select it</p>
                    </div>
                    <div class="actions" id="actions">
                        <!-- Dynamic buttons will be added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settings" class="screen">
            <div class="settings-container">
                <h2>Settings</h2>
                <div class="setting">
                    <label>Game Speed:</label>
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.5" value="1">
                </div>
                <div class="setting">
                    <label>Volume:</label>
                    <input type="range" id="volumeSlider" min="0" max="100" step="10" value="50">
                </div>
                <button id="backBtn" class="btn btn-secondary">Back</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
